info:
  contact: {}
  description: A multi-tenant rest api for managing gym operations.
  title: Gymulty API Documentation
paths:
  /api/tenants/{tenantID}/users:
    post:
      consumes:
      - application/json
      description: |-
        Create a new user for a given tenant with id. For the request body, only the following fields are required:
        tenant_id, first_name, last_name, email, password
      parameters:
      - description: The tenant ID
        in: path
        name: tenantID
        required: true
        type: integer
      - description: the request body
        in: body
        name: User
        required: true
        schema:
          $ref: '#/definitions/domain.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.Response-array_domain_PublicUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.appError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.appError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.appError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.appError'
      summary: Create a user
      tags:
      - users
  /api/tenants/{tenantID}/users/{userID}:
    get:
      consumes:
      - application/json
      description: Get a user by ID
      parameters:
      - description: The tenant ID
        in: path
        name: tenantID
        required: true
        type: integer
      - description: The user ID
        in: path
        name: userID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.Response-array_domain_PublicUser'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.appError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.appError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.appError'
      summary: Get a user by ID
      tags:
      - users
  /api/tenants/signup:
    post:
      consumes:
      - application/json
      description: |-
        Sign up for a new tenant account. This creates a new tenant account along
        with an admin user that manages the all operations for this tenant
      parameters:
      - description: The tenant request body
        in: body
        name: Tenant
        required: true
        schema:
          $ref: '#/definitions/domain.TenantRequestBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.TenantSignupResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/http.appError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.appError'
      summary: Create a tenant
      tags:
      - tenants
swagger: "2.0"
