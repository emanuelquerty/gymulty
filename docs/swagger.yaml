definitions:
  domain.PublicUser:
    properties:
      created_at:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      role:
        type: string
      tenant_id:
        type: integer
      updated_at:
        type: string
    type: object
  domain.Tenant:
    properties:
      businessName:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      status:
        type: string
      subdomain:
        type: string
      updatedAt:
        type: string
    type: object
  domain.TenantRequestBody:
    properties:
      business_name:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      subdomain:
        type: string
    type: object
  http.TenantSignupResponse:
    properties:
      admin:
        $ref: '#/definitions/domain.PublicUser'
      message:
        type: string
      tenant:
